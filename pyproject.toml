[project]
name = "video2docs"
version = "0.1.0"
description = "Turn lecture recordings into slide-aligned transcripts that an LLM or a human can study from."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pyyaml>=6",
  "pymupdf>=1.24",
]

[project.scripts]
video2docs = "v2d.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["v2d"]
